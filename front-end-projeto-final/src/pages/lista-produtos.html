<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/lista-produtos.css">
</head>
<body>
    <nav class="sidebar">
        <!-- sidebar vazia, sempre fora de tudo -->
    </nav>

    <main>
        <div class="content wide">
            <a href="criar-produto.html" class="create-btn">Criar Produto</a>

            <table border="1" cellpadding="5" cellspacing="0">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Unidade</th>
                        <th>Estoque Atual</th>
                        <th>Fila</th>
                        <th>Prateleira</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th>Fabricante</th>
                        <th>Fornecedor</th>
                        <th>Criado em</th>
                        <th>Atualizado  em</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                </tbody>
            </table>
        </div>

        <footer>
            <p>© 2026 — criado por <span style="font-weight: bold;">Elias</span></p>
        </footer>
    </main>

    <!-- Scripts -->
    <script src="/config.js"></script>
    <script type="module" src="../js/sidebar.js"></script>
    <script type="module">
        import { getAllProducts, deleteProduct } from "../api/products.js";

        async function loadProducts() {
            try {
                const content = document.querySelector(".content");
                const products = await getAllProducts();
                console.log(products)

                if (products.ok) {
                    const tbody = document.getElementById("products-table-body");
                    tbody.innerHTML = "";

                    products.data.forEach(prod => {
                        const tr = document.createElement("tr");

                        tr.innerHTML = `
                            <td>${prod.nome}</td>
                            <td>${prod.descricao ?? ''}</td>
                            <td>${prod.unidade_medida ?? ''}</td>
                            <td>${Math.trunc(Number(prod.estoque_atual)) ?? ''}</td>
                            
                            <td>${prod.fila ?? ''}</td>
                            <td>${prod.prateleira ?? ''}</td>
                            <td>${prod.preco ?? ''}</td>
                            <td>${prod.ativo ? 'Sim' : 'Não'}</td>
                            <td>${prod.fabricante_nome ?? ''}</td>
                            <td>${prod.fornecedor_nome ?? ''}</td>
                            <td>${prod.created_at ? new Date(prod.created_at).toLocaleString('pt-BR') : ''}</td>
<td>${prod.updated_at ? new Date(prod.updated_at).toLocaleString('pt-BR') : ''}</td>
                            <td>
                                <button data-id="${prod.id}" data-nome="${prod.nome}" class="move-btn">Movimentar</button>
                                <button data-id="${prod.id}" class="edit-btn">Editar</button>
                                <button data-id="${prod.id}" class="delete-btn">Excluir</button>
                            </td>
                        `;

                        tbody.appendChild(tr);
                    });

                    bindActions();
                } else {
                    content.innerHTML = "<p>Erro ao carregar produtos</p>";
                }
            } catch (err) {
                alert(`Erro ao carregar produtos: ${err}`);
            }
        }

        function bindActions() {
            document.querySelectorAll(".move-btn").forEach(btn => {
                btn.addEventListener("click", e => {
                    const id = e.target.getAttribute("data-id");
                    const nome = e.target.getAttribute("data-nome");

                window.location.href =
                    `criar-movimentacao.html#id=${id}&nome=${encodeURIComponent(nome)}`;
                });
            });

            document.querySelectorAll(".edit-btn").forEach(btn => {
                btn.addEventListener("click", e => {
                    const id = e.target.getAttribute("data-id");
                    window.location.href = `editar-produto.html#id=${id}`;
                });
            });

            document.querySelectorAll(".delete-btn").forEach(btn => {
                btn.addEventListener("click", async e => {
                    const id = e.target.getAttribute("data-id");

                    if (confirm("Confirmar exclusão do produto?")) {
                        try {
                            await deleteProduct(id);
                            loadProducts();
                        } catch (err) {
                            alert("Erro ao excluir produto");
                            console.error(err);
                        }
                    }
                });
            });
        }

        loadProducts();
    </script>
</body>
</html>
