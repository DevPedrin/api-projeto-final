<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/editar-usuario.css">
</head>
<body>
    <nav class="sidebar">
        <!-- sidebar vazia, sempre fora de tudo -->
    </nav>

    <main>
        <h1>Editar Usuário</h1>
        <div class="content">
            <div id="form"></div>
        </div>

        <footer>
            <p>© 2026 — criado por <span style="font-weight: bold;">Samuel</span></p>
        </footer>
    </main>

    <!-- Scripts -->
    <script src="/config.js"></script>
    <script type="module" src="../js/sidebar.js"></script>
    <script type="module">
        import { getAllUsers, updateUser } from "../api/users.js";

        async function init() {
            const hash = new URLSearchParams(window.location.hash.substring(1));
            const id = Number(hash.get("id"));
            console.log(id)

            if (!id) {
                document.getElementById("form").innerHTML = "<p>ID inválido</p>";
                return;
            }

            // não existe getUserById, então pegamos da lista e filtramos
            const response = await getAllUsers();

            if (!response) {
                document.getElementById("form").innerHTML = "<p>Erro ao carregar usuário</p>";
                return;
            }

            const user = response.data.find(u => u.id == id);
            console.log(user);

            if (!user) {
                document.getElementById("form").innerHTML = "<p>Usuário não encontrado</p>";
                return;
            }

            document.getElementById("form").innerHTML = `
                <label>Nome:</label><br>
                <input id="first_name" value="${user.first_name}"><br><br>

                <label>Sobrenome:</label><br>
                <input id="last_name" value="${user.last_name}"><br><br>

                <label>CPF:</label><br>
                <input id="cpf" value="${user.cpf}"><br><br>

                <label>Telefone:</label><br>
                <input id="telefone" value="${user.telefone}"><br><br>

                <label>Email:</label><br>
                <input id="email" value="${user.email}"><br><br>

                <label>Cargo:</label><br>
                <select name="cargo" id="cargo" required>
                    <option value="" disabled selected>Selecione o Cargo</option>
                    <option value="1">Almoxarife</option>
                    <option value="2">Auxiliar de Estoque</option>
                    <option value="3">Estoquista</option>
                    <option value="4">ADM</option>
                    <option value="5">TI</option>
                    <option value="6">Supervisor de Estoque</option>
                    <option value="7">RH</option>
                </select><br><br>

                <button id="salvarBtn">Salvar</button>
                <button onclick="window.location='lista-usuarios.html'">Voltar</button>
            `;

            document.getElementById("salvarBtn").onclick = async () => {
                const data = {
                    first_name: document.getElementById("first_name").value,
                    last_name: document.getElementById("last_name").value,
                    cpf: document.getElementById("cpf").value,
                    telefone: document.getElementById("telefone").value,
                    email: document.getElementById("email").value,
                    role_id: document.getElementById("cargo").value
                };

                const res = await updateUser(id, data);

                if (!res.ok) {
                    alert("Erro ao salvar: " + res.message);
                    return;
                }

                alert("Atualizado com sucesso!");
                window.location = "lista-usuarios.html";
            };
        }

        init();
    </script>
</body>
</html>
