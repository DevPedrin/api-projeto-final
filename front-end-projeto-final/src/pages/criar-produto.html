<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Produto</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/criar-produto.css">
</head>
<body>
    <nav class="sidebar">
        <!-- sidebar vazia, sempre fora de tudo -->
    </nav>

    <main>
        <h1>Criar Produto</h1>
        <div class="content">
            <form id="create-form">
                <label>Nome: <input type="text" name="nome" required></label><br><br>
                <label>Descrição: <input type="text" name="descricao" required></label><br><br>
                <label>Unidade de Medida: <input type="text" name="unidade_medida" required></label><br><br>
                <label>Estoque Atual: <input type="number" step="0.001" name="estoque_atual" required></label><br><br>
                <label>Fila: <input type="text" name="fila"></label><br><br>
                <label>Prateleira: <input type="text" name="prateleira"></label><br><br>
                <label>Preço: <input type="number" step="0.01" name="preco" required></label><br><br>
                <label>Ativo:
                    <select name="ativo">
                        <option value="true" selected>Sim</option>
                        <option value="false">Não</option>
                    </select>
                </label><br><br>
                <label>Fabricante: <input type="text" name="fabricante_nome" required></label><br><br>
                <label>Fornecedor: <input type="text" name="fornecedor_nome"></label><br><br>

                <button type="submit">Criar</button>
            </form>

            <br>
            <a href="lista-produtos.html">Voltar</a>
        </div>

        <footer>
            <p>© 2026 — criado por <span style="font-weight: bold;">Luiz</span></p>
        </footer>
    </main>

    <!-- Scripts -->
     <script src="/config.js"></script>
    <script type="module" src="../js/sidebar.js"></script>
    <script type="module">
        import { createProduct } from "../api/products.js";

        const form = document.getElementById("create-form");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const formData = new FormData(form);

            const payload = {
                nome: formData.get("nome"),
                descricao: formData.get("descricao"),
                unidade_medida: formData.get("unidade_medida"),
                estoque_atual: Number(formData.get("estoque_atual")),
                fila: formData.get("fila"),
                prateleira: formData.get("prateleira"),
                preco: Number(formData.get("preco")),
                ativo: formData.get("ativo") === "true",
                fabricante_nome: formData.get("fabricante_nome"),
                fornecedor_nome: formData.get("fornecedor_nome")
            };

            try {
                await createProduct(payload);
                window.location.href = "lista-produtos.html";
            } catch (err) {
                alert("Erro ao criar produto");
                console.error(err);
            }
        });
    </script>
</body>
</html>
