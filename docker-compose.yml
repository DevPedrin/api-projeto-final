version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: pg-projeto-final
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: batatinha123
      POSTGRES_DB: db-projeto-final
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d

  api:
    build:
      context: ./api-projeto-final
    container_name: api-projeto-final
    restart: always
    env_file:
      - ./api-projeto-final/.env
    depends_on:
      - postgres
    ports:
      - "3000:3000"
      
    volumes:
      - ./api-projeto-final:/app
      - /app/node_modules


  frontend:
    container_name: front-projeto-final
    build:
      context: ./front-end-projeto-final
    ports:
      - "8080:3000"
      
    volumes:
    - ./front-end-projeto-final:/app
    
    depends_on:
      - api
